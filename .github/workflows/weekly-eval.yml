name: Weekly evaluation

# Measures zero-day detection on fresh phishing every Monday and keeps the history in the repo.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download Tranco list
        run: |
          curl -sSL -o tranco.zip https://tranco-list.eu/top-1m.csv.zip
          unzip -o -q tranco.zip

      - name: Run evaluation
        run: npx tsx scripts/eval-weekly.mts top-1m.csv 40

      - name: Store result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/eval-history/*.json || exit 0
          git diff --cached --quiet || git commit -m "Weekly evaluation $(date -u +%Y-%m-%d)"
          git push || true
