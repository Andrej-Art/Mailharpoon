<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&family=Pixelify+Sans:wght@600;700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// The Mailharpoon short, drawn frame by frame. seek(t) paints the frame at t seconds; nothing
// depends on wall-clock time, so every render of the same t is identical.
const W = 1080, H = 1920;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const logo = new Image();
logo.src = "../../public/logo.png";

const PINK = "#ff2e97", VIOLET = "#9d5cff", CYAN = "#33e6ef", RED = "#ff3b5c", GREEN = "#3ddc84", PAPER = "#f4ecff", INK = "#1b0b2e";

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = (k) => 1 - Math.pow(1 - k, 3);
const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function wrap(text, maxW) {
  const words = text.split(" "), lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Big caption near the top, with a dark outline so it reads on any background.
function caption(text, t, a, b, y = 230) {
  const k = Math.min(seg(t, a, a + 0.35), 1 - seg(t, b - 0.3, b));
  if (k <= 0) return;
  ctx.save();
  ctx.globalAlpha = k;
  ctx.font = "900 70px Inter";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  const lines = wrap(text, 940);
  lines.forEach((l, i) => {
    const yy = y + i * 84 + (1 - easeOut(seg(t, a, a + 0.35))) * 30;
    ctx.lineWidth = 14; ctx.strokeStyle = "rgba(10,4,20,0.9)"; ctx.lineJoin = "round";
    ctx.strokeText(l, W / 2, yy);
    ctx.fillStyle = "#fff"; ctx.fillText(l, W / 2, yy);
  });
  ctx.restore();
}

// ---------- world ----------
function sea(t, horizon) {
  const sky = ctx.createLinearGradient(0, 0, 0, horizon);
  sky.addColorStop(0, "#07030f"); sky.addColorStop(1, "#2a0f45");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon + 4);
  // moon
  ctx.save();
  ctx.shadowColor = "rgba(255,200,255,0.8)"; ctx.shadowBlur = 60;
  ctx.fillStyle = "#ffe9fb";
  ctx.beginPath(); ctx.arc(830, horizon - 520, 70, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // stars
  for (let i = 0; i < 40; i++) {
    const x = rnd(i) * W, y = rnd(i + 99) * (horizon - 120);
    ctx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t * 2 + i));
    ctx.fillStyle = "#fff"; ctx.fillRect(x, y, 3, 3);
  }
  ctx.globalAlpha = 1;
  const water = ctx.createLinearGradient(0, horizon, 0, H);
  water.addColorStop(0, "#1d0b3a"); water.addColorStop(1, "#04020a");
  ctx.fillStyle = water; ctx.fillRect(0, horizon, W, H - horizon);
  // light shafts under water
  ctx.save();
  ctx.globalAlpha = 0.07;
  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = i % 2 ? VIOLET : PINK;
    const x = 120 + i * 210 + Math.sin(t * 0.6 + i) * 30;
    ctx.beginPath(); ctx.moveTo(x, horizon); ctx.lineTo(x + 70, horizon); ctx.lineTo(x + 220, H); ctx.lineTo(x - 80, H); ctx.fill();
  }
  ctx.restore();
  // neon wave lines in the logo's colours
  [[PINK, 0, 7], [VIOLET, 26, 5], [CYAN, 52, 3]].forEach(([c, off, lw], j) => {
    ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.globalAlpha = 0.85 - j * 0.2;
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) {
      const y = horizon + off + Math.sin(x / 90 + t * 2.2 + j) * 12 + Math.sin(x / 37 - t * 3) * 4;
      x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  // bubbles
  for (let i = 0; i < 26; i++) {
    const x = rnd(i + 7) * W + Math.sin(t + i) * 12;
    const y = H - ((t * (40 + rnd(i) * 60) + rnd(i + 3) * H) % (H - horizon));
    if (y < horizon + 20) continue;
    ctx.strokeStyle = "rgba(180,160,255,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, 4 + rnd(i) * 8, 0, Math.PI * 2); ctx.stroke();
  }
}

function rain(t, alpha) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha * 0.5;
  ctx.strokeStyle = "#c9b8ff"; ctx.lineWidth = 2;
  for (let i = 0; i < 90; i++) {
    const x = (rnd(i) * W + t * 120) % W;
    const y = (rnd(i + 50) * H + t * 1500) % H;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 40); ctx.stroke();
  }
  ctx.restore();
}

// ---------- phishing monster: an envelope with teeth ----------
function monster(x, y, s, t, o = {}) {
  const bob = Math.sin(t * 3 + (o.phase || 0)) * 10;
  const mouth = o.mouth ?? (0.35 + 0.35 * Math.max(0, Math.sin(t * 5 + (o.phase || 0))));
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(s * (o.flip ? -1 : 1), s);
  ctx.rotate(Math.sin(t * 2 + (o.phase || 0)) * 0.05);
  const w = 300, h = 200;
  // fins
  const fin = Math.sin(t * 9 + (o.phase || 0)) * 18;
  ctx.fillStyle = VIOLET; ctx.strokeStyle = INK; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(w / 2 - 4, 0); ctx.lineTo(w / 2 + 70, -50 + fin); ctx.lineTo(w / 2 + 70, 50 - fin); ctx.closePath(); ctx.fill(); ctx.stroke();
  // open flap = upper jaw
  const fh = 150 * mouth;
  ctx.fillStyle = "#3a0d24";
  ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, -h / 2); ctx.lineTo(0, -h / 2 + 70); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e6d9ff";
  ctx.beginPath(); ctx.moveTo(-w / 2, -h / 2); ctx.lineTo(w / 2, -h / 2); ctx.lineTo(0, -h / 2 - fh); ctx.closePath(); ctx.fill(); ctx.stroke();
  // teeth
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 7; i++) {
    const tx = -w / 2 + 25 + i * 42;
    ctx.beginPath(); ctx.moveTo(tx - 14, -h / 2); ctx.lineTo(tx + 14, -h / 2); ctx.lineTo(tx, -h / 2 + 26); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx - 12, -h / 2 - 2); ctx.lineTo(tx + 12, -h / 2 - 2); ctx.lineTo(tx, -h / 2 - 22 * mouth); ctx.closePath(); ctx.fill();
  }
  // body
  ctx.fillStyle = o.friendly ? "#eafff2" : PAPER;
  roundRect(-w / 2, -h / 2 + 8, w, h - 8, 18); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = "rgba(27,11,46,0.35)"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-w / 2 + 10, h / 2 - 8); ctx.lineTo(0, 10); ctx.lineTo(w / 2 - 10, h / 2 - 8); ctx.stroke();
  // eyes
  if (o.clock) {
    [-60, 60].forEach((ex) => {
      ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(ex, -40, 34, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = RED; ctx.lineWidth = 5;
      const a = t * 6;
      ctx.beginPath(); ctx.moveTo(ex, -40); ctx.lineTo(ex + Math.cos(a) * 24, -40 + Math.sin(a) * 24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex, -40); ctx.lineTo(ex + Math.cos(a / 12) * 15, -40 + Math.sin(a / 12) * 15); ctx.stroke();
    });
  } else if (o.friendly) {
    ctx.fillStyle = INK;
    [-55, 55].forEach((ex) => { ctx.beginPath(); ctx.arc(ex, -35, 12, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, -10, 34, 0.2, Math.PI - 0.2); ctx.stroke();
  } else {
    ctx.save();
    ctx.shadowColor = RED; ctx.shadowBlur = 30; ctx.fillStyle = RED;
    [-60, 60].forEach((ex) => { ctx.beginPath(); ctx.ellipse(ex, -38, 26, 18, ex > 0 ? -0.3 : 0.3, 0, Math.PI * 2); ctx.fill(); });
    ctx.restore();
    ctx.fillStyle = "#fff"; [-52, 68].forEach((ex) => { ctx.beginPath(); ctx.arc(ex, -42, 6, 0, Math.PI * 2); ctx.fill(); });
    ctx.strokeStyle = INK; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(-95, -72); ctx.lineTo(-30, -56); ctx.moveTo(95, -72); ctx.lineTo(30, -56); ctx.stroke();
  }
  if (o.mustache) {
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.ellipse(-30, 2, 40, 14, 0.25, 0, Math.PI * 2); ctx.ellipse(30, 2, 40, 14, -0.25, 0, Math.PI * 2); ctx.fill();
  }
  if (o.label) {
    ctx.fillStyle = o.friendly ? "#138a4a" : RED; ctx.font = "900 34px Inter"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.save(); if (o.flip) ctx.scale(-1, 1); // keep the text readable on mirrored monsters
    ctx.fillText(o.label, 0, 55);
    ctx.restore();
  }
  ctx.restore();
  if (o.lure) {
    // angler lure: a glowing parcel with a price tag on a thin line
    const lx = x - 40 * s, ly = y + bob - 260 * s + Math.sin(t * 4) * 12;
    ctx.save();
    ctx.strokeStyle = "#d8c8ff"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, y + bob - 140 * s); ctx.quadraticCurveTo(x + 60 * s, ly - 80 * s, lx, ly); ctx.stroke();
    ctx.shadowColor = "#ffd34d"; ctx.shadowBlur = 50;
    ctx.fillStyle = "#c98a3e"; roundRect(lx - 70, ly, 140, 100, 10); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = "#8d5a22"; ctx.fillRect(lx - 8, ly, 16, 100);
    ctx.fillStyle = "#ffd34d"; roundRect(lx + 30, ly - 50, 170, 64, 10); ctx.fill();
    ctx.fillStyle = INK; ctx.font = "900 36px Inter"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("1,99 €", lx + 115, ly - 18);
    ctx.restore();
  }
  if (o.sign) {
    ctx.save();
    ctx.translate(x + 150 * s, y + bob + 40 * s);
    ctx.rotate(Math.PI + Math.sin(t * 2) * 0.08);
    ctx.fillStyle = "#fff"; ctx.strokeStyle = INK; ctx.lineWidth = 6;
    roundRect(-120, -45, 240, 90, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1f4fd8"; ctx.font = "900 40px Inter"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("Ihre Bank", 0, 2);
    ctx.restore();
  }
}

// ---------- the captain, cut from the logo above its banner ----------
const CROP = { x: 0, y: 0, w: 512, h: 236 };
function captain(x, y, s, t, glow = 0) {
  if (!logo.complete) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t * 1.6) * 0.03);
  ctx.drawImage(logo, CROP.x, CROP.y, CROP.w, CROP.h, -CROP.w * s / 2, -CROP.h * s, CROP.w * s, CROP.h * s);
  ctx.restore();
  if (glow > 0) {
    const tip = captainTip(x, y, s);
    const g = ctx.createRadialGradient(tip.x, tip.y, 0, tip.x, tip.y, 140 * glow);
    g.addColorStop(0, "rgba(255,255,255,0.95)"); g.addColorStop(0.3, "rgba(255,46,151,0.7)"); g.addColorStop(1, "rgba(255,46,151,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(tip.x, tip.y, 140 * glow, 0, Math.PI * 2); ctx.fill();
  }
}
const captainTip = (x, y, s) => ({ x: x + (42 - CROP.w / 2) * s, y: y + (24 - CROP.h) * s });

function boat(x, y, t) {
  ctx.save();
  ctx.translate(x, y + Math.sin(t * 2.2) * 8);
  ctx.rotate(Math.sin(t * 1.6) * 0.03);
  ctx.fillStyle = "#4a2a1a"; ctx.strokeStyle = INK; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-330, -40); ctx.lineTo(330, -40); ctx.lineTo(250, 70); ctx.lineTo(-250, 70); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PINK; ctx.fillRect(-300, -30, 600, 12);
  ctx.restore();
}

function harpoon(x1, y1, x2, y2, k) {
  if (k <= 0) return;
  const x = lerp(x1, x2, k), y = lerp(y1, y2, k), a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save();
  ctx.strokeStyle = "rgba(255,46,151,0.5)"; ctx.lineWidth = 16; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(lerp(x1, x2, Math.max(0, k - 0.35)), lerp(y1, y2, Math.max(0, k - 0.35))); ctx.lineTo(x, y); ctx.stroke();
  ctx.translate(x, y); ctx.rotate(a);
  ctx.shadowColor = "#fff"; ctx.shadowBlur = 30;
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(-160, 0); ctx.lineTo(0, 0); ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(30, 0); ctx.lineTo(-20, -24); ctx.lineTo(-20, 24); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function stamp(x, y, t0, t, text = "GEFÄHRLICH", color = RED) {
  const k = seg(t, t0, t0 + 0.18);
  if (k <= 0) return;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.18); ctx.scale(lerp(2.4, 1, easeOut(k)), lerp(2.4, 1, easeOut(k)));
  ctx.globalAlpha = k;
  ctx.strokeStyle = color; ctx.lineWidth = 10; roundRect(-230, -55, 460, 110, 14); ctx.stroke();
  ctx.fillStyle = color; ctx.font = "900 70px Inter"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, 0, 4);
  ctx.restore();
}

function confetti(x, y, t0, t, seed) {
  const k = t - t0;
  if (k < 0 || k > 1.6) return;
  for (let i = 0; i < 40; i++) {
    const a = rnd(seed + i) * Math.PI * 2, v = 300 + rnd(seed + i + 50) * 700;
    const px = x + Math.cos(a) * v * k, py = y + Math.sin(a) * v * k + 500 * k * k;
    ctx.save();
    ctx.globalAlpha = 1 - k / 1.6;
    ctx.translate(px, py); ctx.rotate(k * 10 + i);
    ctx.fillStyle = i % 3 ? PAPER : PINK;
    ctx.fillRect(-14, -9, 28, 18);
    ctx.restore();
  }
}

function flash(t, at) {
  const k = 1 - seg(t, at, at + 0.35);
  if (t < at || k <= 0) return;
  ctx.fillStyle = `rgba(255,240,255,${0.85 * k})`; ctx.fillRect(0, 0, W, H);
}

// ---------- scenes ----------
function scene1(t) {
  sea(t, 260);
  const big = easeOut(seg(t, 1.2, 2.4));
  for (let i = 0; i < 9; i++) {
    const x = ((rnd(i) * 1400 + t * (90 + rnd(i + 1) * 80)) % 1500) - 200;
    monster(x, 700 + rnd(i + 2) * 1000, 0.35 + rnd(i + 4) * 0.25, t, { phase: i, flip: true });
  }
  if (big > 0) monster(540, lerp(2300, 1250, big), 1.6, t, { label: "Konto gesperrt!", phase: 1, mouth: 0.3 + 0.6 * Math.abs(Math.sin(t * 3)) });
  caption("Jeden Tag schwimmen Millionen davon herum.", t, 0.3, 4.9);
}

function scene2(t) {
  sea(t, 260);
  const parts = [[5, 7, { lure: true, label: "Paketgebühr" }], [7, 9, { clock: true, label: "Nur noch heute!" }], [9, 11, { mustache: true, sign: true, label: "Echt jetzt!" }]];
  for (const [a, b, o] of parts) {
    if (t < a || t >= b) continue;
    const k = easeOut(seg(t, a, a + 0.45));
    monster(lerp(1400, 470, k), 1150, 1.5, t, { ...o, phase: a });
    if (o.clock) {
      ctx.fillStyle = RED; ctx.font = "900 110px Pixelify Sans"; ctx.textAlign = "center";
      const left = Math.max(0, 23 * 3600 + 59 * 60 + 59 - Math.floor((t - a) * 60));
      ctx.fillText(`${String(Math.floor(left / 3600)).padStart(2, "0")}:${String(Math.floor(left / 60) % 60).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`, W / 2, 1600);
    }
  }
  caption("Paketgebühr.", t, 5.1, 7);
  caption("Kontosperrung.", t, 7, 9);
  caption("Falsche Bank.", t, 9, 10.95);
}

function scene3(t) {
  sea(t, 1060);
  rain(t, 1);
  const rise = easeOut(seg(t, 11.3, 12.4));
  boat(540, 1110, t);
  captain(560, lerp(1500, 1080, rise), 1.75, t, seg(t, 13, 13.6) * (0.8 + 0.2 * Math.sin(t * 12)));
  boat(540, 1110, t); // the hull in front of the captain's legs
  flash(t, 11.05); flash(t, 11.5);
  caption("Nicht mit ihm.", t, 11.8, 16.9);
}

const TARGETS = [[260, 1600, 17.6], [800, 1450, 19.3], [430, 1780, 21.0]];
function scene4(t) {
  sea(t, 1060);
  rain(t, 0.6);
  boat(540, 1110, t);
  const cx = 560, cy = 1080, s = 1.75;
  captain(cx, cy, s, t, 0.6);
  boat(540, 1110, t);
  const tip = captainTip(cx, cy, s);
  TARGETS.forEach(([x, y, at], i) => {
    const hit = at + 0.45;
    if (t < hit + 0.35) monster(x, y, 0.75, t, { phase: i * 2, flip: i % 2 === 0 });
    harpoon(tip.x, tip.y, x, y, t < hit ? easeInOut(seg(t, at, hit)) : 0);
    // scan beam
    if (t > at - 0.4 && t < hit) {
      ctx.strokeStyle = "rgba(51,230,239,0.6)"; ctx.lineWidth = 3; ctx.setLineDash([12, 10]);
      ctx.beginPath(); ctx.moveTo(tip.x, tip.y); ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
    }
    if (t >= hit && t < hit + 1.4) stamp(x, y - 30, hit, t);
    confetti(x, y, hit + 0.35, t, i * 100);
  });
  // a real letter swims by and gets a friendly check mark
  const fk = easeOut(seg(t, 22.6, 23.3));
  if (fk > 0) {
    monster(lerp(-300, 760, fk), 1650, 0.75, t, { friendly: true, mouth: 0, label: "Echt", phase: 3, flip: true });
    if (t > 23.4) {
      const k = back(seg(t, 23.4, 23.8));
      ctx.save(); ctx.translate(900, 1520); ctx.scale(k, k);
      ctx.fillStyle = GREEN; ctx.beginPath(); ctx.arc(0, 0, 60, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 14; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(-26, 2); ctx.lineTo(-6, 22); ctx.lineTo(28, -20); ctx.stroke();
      ctx.restore();
    }
  }
  caption("Mailharpoon prüft Links und Nachrichten in Sekunden.", t, 17.2, 24.9);
}

function scene5(t) {
  sea(t, 1250);
  const k = easeOut(seg(t, 25, 25.7));
  const px = 540, py = lerp(2300, 1000, k);
  ctx.save();
  ctx.translate(px, py);
  ctx.shadowColor = "rgba(255,46,151,0.5)"; ctx.shadowBlur = 80;
  ctx.fillStyle = "#121018"; roundRect(-300, -520, 600, 1040, 60); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#0b0a12"; roundRect(-272, -490, 544, 980, 40); ctx.fill();
  ctx.fillStyle = PINK; ctx.font = "700 40px Pixelify Sans"; ctx.textAlign = "center"; ctx.fillText("Mailharpoon", 0, -400);
  // pasted link
  ctx.strokeStyle = "#5b4b7a"; ctx.lineWidth = 3; roundRect(-230, -330, 460, 90, 12); ctx.stroke();
  const link = "paket-info24.top/gebuehr";
  const typed = link.slice(0, Math.floor(seg(t, 25.8, 26.8) * link.length));
  ctx.fillStyle = "#e8e0ff"; ctx.font = "500 30px Inter"; ctx.textAlign = "left"; ctx.fillText(typed, -205, -275);
  const pressed = t > 27;
  ctx.fillStyle = pressed ? PINK : "rgba(255,46,151,0.4)"; roundRect(-230, -220, 460, 80, 12); ctx.fill();
  ctx.fillStyle = "#14051c"; ctx.font = "700 36px Pixelify Sans"; ctx.textAlign = "center"; ctx.fillText("PRÜFEN", 0, -168);
  // result
  const r = seg(t, 27.4, 27.9);
  if (r > 0) {
    ctx.globalAlpha = r;
    ctx.strokeStyle = RED; ctx.lineWidth = 4; roundRect(-230, -100, 460, 470, 16); ctx.stroke();
    ctx.fillStyle = "rgba(255,59,92,0.08)"; ctx.fill();
    ctx.fillStyle = RED; ctx.font = "900 64px Inter"; ctx.fillText("Gefährlich", 0, -10);
    const score = Math.round(96 * easeOut(seg(t, 27.6, 28.6)));
    ctx.font = "700 90px Pixelify Sans"; ctx.fillText(String(score), 0, 100);
    for (let i = 0; i < 12; i++) {
      ctx.fillStyle = i / 12 < score / 100 ? RED : "#2b2240";
      ctx.fillRect(-200 + i * 34, 140, 28, 24);
    }
    ctx.fillStyle = "#d0c6ea"; ctx.font = "500 28px Inter"; ctx.textAlign = "left";
    ["Domain erst 3 Tage alt", "Fragt nach Kartendaten", "Bekannte Masche"].forEach((l, i) => {
      if (t > 28.4 + i * 0.3) ctx.fillText("• " + l, -200, 220 + i * 46);
    });
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  // a tiny monster peeks out and flees
  const peek = seg(t, 29.2, 29.6), flee = seg(t, 29.9, 30.6);
  if (peek > 0) monster(lerp(880, 1300, easeInOut(flee)), lerp(1500, 1330, peek) + flee * 300, 0.45, t, { phase: 5, mouth: 0.1 });
  caption("Erst prüfen, dann klicken.", t, 25.2, 30.9);
}

function scene6(t) {
  const g = ctx.createRadialGradient(W / 2, 820, 50, W / 2, 820, 1100);
  g.addColorStop(0, "#3a1060"); g.addColorStop(1, "#06030d");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const k = back(seg(t, 31.1, 31.8));
  if (logo.complete) {
    ctx.save();
    ctx.translate(W / 2, 820); ctx.scale(k, k);
    ctx.shadowColor = PINK; ctx.shadowBlur = 60 + 30 * Math.sin(t * 4);
    ctx.drawImage(logo, -440, -376, 880, 752);
    ctx.restore();
  }
  const tk = seg(t, 32, 32.5);
  ctx.save();
  ctx.globalAlpha = tk; ctx.textAlign = "center";
  ctx.shadowColor = PINK; ctx.shadowBlur = 30;
  ctx.fillStyle = "#fff"; ctx.font = "700 100px Pixelify Sans"; ctx.fillText("mailharpoon.com", W / 2, 1400 + (1 - tk) * 30);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#cbbcf0"; ctx.font = "800 50px Inter"; ctx.fillText("Kostenlos · ohne Anmeldung", W / 2, 1500);
  ctx.restore();
  // stripes like the site's wordmark
  ["#ff2e97", "#d94bd8", "#9d5cff", "#33e6ef"].forEach((c, i) => {
    ctx.fillStyle = c; ctx.fillRect(lerp(W / 2, 190, seg(t, 32.3, 32.9)), 1560 + i * 14, lerp(0, 700, seg(t, 32.3, 32.9)), 7);
  });
}

function seek(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (t < 5) scene1(t);
  else if (t < 11) scene2(t);
  else if (t < 17) scene3(t);
  else if (t < 25) scene4(t);
  else if (t < 31) scene5(t);
  else scene6(t);
  // short dip to black between scenes
  for (const b of [5, 11, 17, 25, 31]) {
    const k = 1 - Math.abs(t - b) / 0.18;
    if (k > 0 && b !== 11) { ctx.fillStyle = `rgba(0,0,0,${k})`; ctx.fillRect(0, 0, W, H); }
  }
}

window.ready = Promise.all([document.fonts.load("900 70px Inter"), document.fonts.load("700 40px Pixelify Sans"), new Promise((r) => (logo.complete ? r() : (logo.onload = r)))]);
window.frame = (t) => { seek(t); return cv.toDataURL("image/jpeg", 0.9).split(",")[1]; };
</script>
